name: Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test time policy and parent authentication
        run: dotnet run --configuration Release --project tests/PolicyChecks.csproj
      - name: Publish the self-contained Windows application
        run: dotnet publish src/Windows/Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Assemble the installer
        run: |
          sudo apt-get update
          sudo apt-get install --yes nsis
          makensis -INPUTCHARSET UTF8 installer/ControlTime.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: ControlTime-Setup-x64
          path: artifacts/ControlTime-Setup-x64.exe
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ControlTime-Setup-x64
      - name: Install ControlTime
        shell: pwsh
        run: |
          $installer = (Resolve-Path ControlTime-Setup-x64.exe).Path
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Write-Host "::error::Setup exited with $($install.ExitCode)"
            exit 1
          }
      - name: Upgrade while the application is running
        shell: pwsh
        run: |
          $running = $null
          try {
            $installedApp = Join-Path $env:ProgramFiles 'ControlTime\app\ControlTime.exe'
            $running = Start-Process -FilePath $installedApp -ArgumentList '--tray' -PassThru
            if (-not $running.WaitForInputIdle(15000) -or $running.HasExited) {
              throw 'The installed dashboard did not start'
            }

            $installer = (Resolve-Path ControlTime-Setup-x64.exe).Path
            $upgrade = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($upgrade.ExitCode -ne 0) { throw "Upgrade exited with $($upgrade.ExitCode)" }
            if (-not $running.HasExited) { throw 'The previous dashboard is still running' }
          } catch {
            Write-Host "::error::$($_.Exception.GetBaseException().Message)"
            exit 1
          } finally {
            if ($running) {
              if (-not $running.HasExited) { Stop-Process -Id $running.Id -Force }
              $running.Dispose()
            }
          }
      - name: Verify service registration and startup
        shell: pwsh
        run: |
          try {
            $service = Get-Service ControlTime
            try {
              $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            } finally {
              $service.Dispose()
            }

            $app = '"' + (Join-Path $env:ProgramFiles 'ControlTime\app\ControlTime.exe') + '"'
            $registered = Get-CimInstance Win32_Service -Filter "Name='ControlTime'"
            if ($registered.PathName -ne "$app --service" -or $registered.StartMode -ne 'Auto' -or $registered.StartName -ne 'LocalSystem') {
              throw "Unexpected service registration: $($registered.PathName) / $($registered.StartMode) / $($registered.StartName)"
            }
            $startupKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run'
            if ((Get-ItemPropertyValue $startupKey ControlTime) -ne "$app --tray") {
              throw 'Startup for the password window is missing'
            }
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }
      - name: Read delayed replies from the installed service
        shell: pwsh
        run: |
          $phase = 'preparing the pipe client'
          try {
            $rights = [System.IO.Pipes.PipeAccessRights]'ReadWrite, ReadPermissions, Synchronize'
            $request = [Text.Encoding]::UTF8.GetBytes('{"Command":"status"}')
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $timeout = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(5))
              $pipe = [System.IO.Pipes.NamedPipeClientStream]::new(
                '.', 'ControlTime.Parent.v2', $rights,
                [System.IO.Pipes.PipeOptions]::Asynchronous,
                [System.Security.Principal.TokenImpersonationLevel]::Anonymous,
                [System.IO.HandleInheritability]::None)
              try {
                $phase = "connecting (request $attempt)"
                $pipe.ConnectAsync($timeout.Token).GetAwaiter().GetResult()
                $phase = "checking pipe ownership (request $attempt)"
                $acl = [System.IO.Pipes.PipesAclExtensions]::GetAccessControl($pipe)
                if ($acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -ne 'S-1-5-18') {
                  throw 'The pipe is not owned by LocalSystem'
                }

                $phase = "sending the status request (request $attempt)"
                $header = [BitConverter]::GetBytes([int]$request.Length)
                $pipe.Write($header, 0, $header.Length)
                $pipe.Write($request, 0, $request.Length)
                Start-Sleep -Milliseconds 300
                $phase = "reading the status response (request $attempt)"
                $pipe.ReadExactlyAsync($header, 0, $header.Length, $timeout.Token).AsTask().GetAwaiter().GetResult()
                $length = [BitConverter]::ToInt32($header, 0)
                if ($length -lt 1 -or $length -gt 65536) { throw "Invalid response size: $length" }
                $reply = [byte[]]::new($length)
                $pipe.ReadExactlyAsync($reply, 0, $reply.Length, $timeout.Token).AsTask().GetAwaiter().GetResult()
                $status = [Text.Encoding]::UTF8.GetString($reply) | ConvertFrom-Json
                if ($status.Configured -ne $false -or -not $status.Message) {
                  throw 'Expected an unconfigured status from the installed service'
                }
              } finally {
                $pipe.Dispose()
                $timeout.Dispose()
              }
            }
          } catch {
            Write-Host "::error::${phase}: $($_.Exception.Message)"
            exit 1
          }
      - name: Remove ControlTime
        if: always()
        shell: pwsh
        run: |
          try {
            $uninstaller = Join-Path $env:ProgramFiles 'ControlTime\Uninstall.exe'
            if (Test-Path $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Uninstall exited with $($uninstall.ExitCode)" }
            }
            if (Get-Service ControlTime -ErrorAction SilentlyContinue) { throw 'Service still registered' }
            $startupKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run'
            if ((Get-ItemProperty $startupKey).PSObject.Properties.Name -contains 'ControlTime') {
              throw 'Startup entry still present'
            }
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }
